type: array
items:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - status
  properties:
    id:
      type: integer
    name:
      type: string
    photo:
      anyOf:
        - type: string
        - type: "null"
    rating:
      anyOf:
        - type: integer
        - type: "null"
    status:
      type: string
      enum:
        - "watching"
        - "watched"
        - "will_watch"
    review:
      anyOf:
        - type: string
        - type: "null"
